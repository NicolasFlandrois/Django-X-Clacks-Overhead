# SPDX-License-Identifier: GPL-3.0-or-later
# Django X-Clacks-Overhead - GNU Terry Pratchett tribute middleware

[project]
name = "django-x-clacks-overhead"
version = "1.0.0"
description = "A X-Clacks-Overhead package for Django! Middleware, Mixin, Decorator"
authors = [{name="Nicolas Flandrois", email="contacts@flandrois.com"},]
maintainers = [{name="Nicolas Flandrois", email="nicolas.dev@flandrois.com"},]
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

keywords = ["django", "x-clacks-overhead", "GNU Terry Pratchett", "Middleware", "Mixin", "Decorator"]

dependencies = [
    "django>=5.0.0",
]

[project.optional-dependencies]
drf = [
    "djangorestframework>=3.14.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["clacks"]

[tool.setuptools.package-dir]
"" = "src"

# UV-specific dependency groups (PEP 735)
# For pip compatibility, use: pip install .[dev]
[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"}
]
lint = [
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "ruff>=0.14.8",
]
test = [
    "django>=6.0.3",
    "djangorestframework>=3.16.1",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
]

[project.urls]
"Homepage" = "https://github.com/NicolasFlandrois/Django-X-Clacks-Overhead"
"GitHub" = "https://github.com/NicolasFlandrois/Django-X-Clacks-Overhead"

[tool.pytest.ini_options]
pythonpath = [
  ".", "src",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Target Python 3.12+
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
